<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumpulan Tugas Game RPL - Zona Siswa</title>
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:gamepad-2.svg?color=%2306b6d4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg-primary);
      background-image: radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed; color: var(--text-main); line-height: 1.6; min-height: 100vh;
    }
    header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); padding: 2.5rem 1rem 1.5rem; text-align: center; }
    .hero-title { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.4rem; }
    .hero-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .btn-nav { padding: 10px 20px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: var(--text-main); border-radius: 30px; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    main { max-width: 1200px; margin: 1.5rem auto 3rem; padding: 0 1.5rem; }
    .form-box { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); max-width: 650px; margin: 0 auto; padding: 2.5rem; border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #e2e8f0; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 10px; color: white; font-size: 0.95rem; }
    .form-group input[type="file"] { padding: 8px; cursor: pointer; }
    .btn-submit-form { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .swal2-popup { background: #1e293b !important; color: #f8fafc !important; border: 1px solid var(--glass-border) !important; border-radius: 16px !important; }
    .swal2-title { color: #f8fafc !important; }
    .swal2-html-container { color: #94a3b8 !important; }
  </style>
</head>
<body>

  <header>
    <h1 class="hero-title">🎓 ZONA SISWA: FORM PENGUMPULAN</h1>
    <p class="hero-subtitle">Isi data tugas Anda. Game & Cover akan langsung otomatis muncul di Galeri Showcase!</p>
    <nav>
      <a href="index.html" class="btn-nav">← Kembali ke Showcase Game</a>
    </nav>
  </header>

  <main>
    <div class="form-box">
      <!-- Hidden Iframe Pengaman Upload -->
      <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

      <form id="submissionForm" action="https://script.google.com/macros/s/AKfycbxm6EWSN6KpaH2QR9Jtznl3MJToPRD49zJZgPpjm8piLcsdED-aFnqfWTcYHJx6pbEo/exec" method="POST" target="hidden_iframe">
        <div class="form-group">
          <label for="namaSiswa">Nama Lengkap Siswa</label>
          <input type="text" id="namaSiswa" name="namaSiswa" placeholder="Contoh: Ahmad Yani" required>
        </div>

        <div class="form-group">
          <label for="kelas">Kelas / Jurusan</label>
          <input type="text" id="kelas" name="kelas" placeholder="Contoh: XI RPL 1" required>
        </div>

        <div class="form-group">
          <label for="judulGame">Judul Game</label>
          <input type="text" id="judulGame" name="judulGame" placeholder="Contoh: Petualangan Congklak" required>
        </div>

        <div class="form-group">
          <label for="kategori">Kategori Game</label>
          <select id="kategori" name="kategori" required>
            <option value="Game Tradisional">Game Tradisional</option>
            <option value="Game Edukasi">Game Edukasi</option>
          </select>
        </div>

        <div class="form-group">
          <label for="gameUrl">URL Live Demo Game (GitHub Pages / Vercel / Netlify)</label>
          <input type="url" id="gameUrl" name="gameUrl" placeholder="https://username.github.io/repository-game/" required>
        </div>

        <div class="form-group">
          <label for="thumbnailFile">Upload Screenshot / Cover Game (PNG / JPG - Maks 1.5MB)</label>
          <input type="file" id="thumbnailFile" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="deskripsi">Deskripsi Singkat & Cara Bermain</label>
          <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Jelaskan secara singkat aturan atau cara memainkan game ini..." required></textarea>
        </div>

        <!-- Dynamic Inputs -->
        <input type="hidden" id="fileBase64" name="fileBase64">
        <input type="hidden" id="fileName" name="fileName">
        <input type="hidden" id="fileMimeType" name="fileMimeType">

        <button type="submit" id="submitBtn" class="btn-submit-form">
          <span>🚀</span> Kirim Tugas Game
        </button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    if (sessionStorage.getItem("siswaAuthenticated") !== "true") {
      Swal.fire({ icon: 'error', title: 'Akses Ditolak!', text: 'Silakan masuk melalui tombol Zona Siswa di halaman utama.' })
        .then(() => { window.location.href = "index.html"; });
    }

    let submitted = false;

    // Respon saat data & foto berhasil masuk ke Google Drive & Sheets
    document.getElementById('hidden_iframe').onload = function() {
      if (submitted) {
        Swal.fire({
          icon: 'success',
          title: 'Tugas Berhasil Dikirim!',
          text: 'Data tugas & screenshot game Anda telah tersimpan di Drive!',
          confirmButtonColor: '#10b981',
          confirmButtonText: 'Lihat di Showcase 🎮'
        }).then(() => {
          window.location.href = "index.html";
        });
      }
    };

    document.getElementById("submissionForm").addEventListener("submit", function(e) {
      const submitBtn = document.getElementById("submitBtn");
      const fileInput = document.getElementById("thumbnailFile");
      const file = fileInput.files[0];

      if (!file) {
        e.preventDefault();
        Swal.fire({ icon: 'warning', title: 'Foto Kosong', text: 'Pilih foto screenshot game dulu.' });
        return;
      }

      if (file.size > 1.5 * 1024 * 1024) {
        e.preventDefault();
        Swal.fire({ icon: 'error', title: 'File Terlalu Besar', text: 'Ukuran foto maksimal 1.5 MB.' });
        return;
      }

      e.preventDefault();
      submitBtn.innerHTML = `<span>⏳</span> Mengunggah Foto ke Drive...`;
      submitBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById("fileBase64").value = reader.result;
        document.getElementById("fileName").value = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, "_")}`;
        document.getElementById("fileMimeType").value = file.type || "image/png";

        submitted = true;
        document.getElementById("submissionForm").submit(); // Submit Native
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
