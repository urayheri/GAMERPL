<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumpulan Tugas Game RPL - Zona Siswa</title>
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:gamepad-2.svg?color=%2306b6d4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- SweetAlert2 CSS untuk Notifikasi Modern -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 2.5rem 1rem 1.5rem;
      text-align: center;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .btn-nav {
      padding: 10px 20px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    main {
      max-width: 1200px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.5rem;
    }

    .form-box {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      max-width: 650px;
      margin: 0 auto;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-group input[type="file"] {
      padding: 8px;
      cursor: pointer;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .btn-submit-form {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit-form:hover {
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      filter: brightness(1.1);
    }

    .btn-submit-form:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }

    /* Kustomisasi Tema Dark SweetAlert2 */
    .swal2-popup {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 16px !important;
      backdrop-filter: blur(16px);
    }
    .swal2-title {
      color: #f8fafc !important;
    }
    .swal2-html-container {
      color: #94a3b8 !important;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="hero-title">🎓 ZONA SISWA: FORM PENGUMPULAN</h1>
    <p class="hero-subtitle">Isi data tugas Anda. Game & Cover akan langsung otomatis muncul di Galeri Showcase!</p>
    <nav>
      <a href="index.html" class="btn-nav">← Kembali ke Showcase Game</a>
    </nav>
  </header>

  <main>
    <div class="form-box">
      <form id="submissionForm">
        <div class="form-group">
          <label for="namaSiswa">Nama Lengkap Siswa</label>
          <input type="text" id="namaSiswa" placeholder="Contoh: Ahmad Yani" required>
        </div>

        <div class="form-group">
          <label for="kelas">Kelas / Jurusan</label>
          <input type="text" id="kelas" placeholder="Contoh: XI RPL 1" required>
        </div>

        <div class="form-group">
          <label for="judulGame">Judul Game</label>
          <input type="text" id="judulGame" placeholder="Contoh: Petualangan Congklak" required>
        </div>

        <div class="form-group">
          <label for="kategori">Kategori Game</label>
          <select id="kategori" required>
            <option value="Game Tradisional">Game Tradisional</option>
            <option value="Game Edukasi">Game Edukasi</option>
          </select>
        </div>

        <div class="form-group">
          <label for="gameUrl">URL Live Demo Game (GitHub Pages / Vercel / Netlify)</label>
          <input type="url" id="gameUrl" placeholder="https://username.github.io/repository-game/" required>
        </div>

        <div class="form-group">
          <label for="thumbnailFile">Upload Screenshot / Cover Game (PNG / JPG / WEBP)</label>
          <input type="file" id="thumbnailFile" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="deskripsi">Deskripsi Singkat & Cara Bermain</label>
          <textarea id="deskripsi" rows="4" placeholder="Jelaskan secara singkat aturan atau cara memainkan game ini..." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit-form">
          <span>🚀</span> Kirim Tugas Game
        </button>
      </form>
    </div>
  </main>

  <!-- SweetAlert2 JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    // Proteksi Akses Langsung
    if (sessionStorage.getItem("siswaAuthenticated") !== "true") {
      Swal.fire({
        icon: 'error',
        title: 'Akses Ditolak!',
        text: 'Silakan masuk melalui tombol Zona Siswa di halaman utama.',
        confirmButtonColor: '#06b6d4'
      }).then(() => {
        window.location.href = "index.html";
      });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbx492EqcyC4F6kETP2nDkvU4OtzJF-KL8azgLzx3CYiWFC_dX6udJl0mUfVOXC6wmppSQ/exec";

    document.getElementById("submissionForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerHTML = `<span>⏳</span> Mengunggah File & Data...`;
      submitBtn.disabled = true;

      const fileInput = document.getElementById("thumbnailFile");
      const file = fileInput.files[0];

      if (!file) {
        Swal.fire({
          icon: 'warning',
          title: 'File Gambar Kosong',
          text: 'Pilih file screenshot cover game terlebih dahulu.',
          confirmButtonColor: '#06b6d4'
        });
        submitBtn.innerHTML = `<span>🚀</span> Kirim Tugas Game`;
        submitBtn.disabled = false;
        return;
      }

      // Validasi Ukuran File (Maksimal 3MB)
      if (file.size > 3 * 1024 * 1024) {
        Swal.fire({
          icon: 'error',
          title: 'Ukuran File Terlalu Besar',
          text: 'Ukuran foto maksimal adalah 3 MB. Silakan kompres foto Anda terlebih dahulu.',
          confirmButtonColor: '#ef4444'
        });
        submitBtn.innerHTML = `<span>🚀</span> Kirim Tugas Game`;
        submitBtn.disabled = false;
        return;
      }

      // Helper Reader File ke Base64
      const getBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
        });
      };

      try {
        const base64String = await getBase64(file);

        const payload = {
          namaSiswa: document.getElementById("namaSiswa").value,
          kelas: document.getElementById("kelas").value,
          judulGame: document.getElementById("judulGame").value,
          kategori: document.getElementById("kategori").value,
          gameUrl: document.getElementById("gameUrl").value,
          deskripsi: document.getElementById("deskripsi").value,
          fileBase64: base64String,
          fileName: `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, "_")}`,
          fileMimeType: file.type || "image/png"
        };

        // Kirim Data via Fetch API
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        // Notifikasi Sukses Modern
        Swal.fire({
          icon: 'success',
          title: 'Tugas Berhasil Dikirim!',
          text: 'Game Anda telah tersimpan dan siap dimainkan di Galeri Showcase.',
          confirmButtonColor: '#10b981',
          confirmButtonText: 'Lihat di Showcase 🎮'
        }).then(() => {
          window.location.href = "index.html";
        });

      } catch (error) {
        console.error("Error submit:", error);
        
        Swal.fire({
          icon: 'error',
          title: 'Gagal Mengirim Data',
          text: 'Terjadi kendala koneksi saat mengunggah data. Silakan coba beberapa saat lagi.',
          confirmButtonColor: '#ef4444'
        });

        submitBtn.innerHTML = `<span>🚀</span> Kirim Tugas Game`;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
