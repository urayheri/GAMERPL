<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase Game Siswa RPL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎮 Showcase Game Karya Siswa RPL</h1>
    <p>Galeri Proyek & Tugas Game Siswa Rekayasa Perangkat Lunak</p>
    <nav>
      <button class="btn-filter active" onclick="filterGames('Semua')">Semua Game</button>
      <button class="btn-filter" onclick="filterGames('Game Tradisional')">Game Tradisional</button>
      <button class="btn-filter" onclick="filterGames('Game Edukasi')">Game Edukasi</button>
      <a href="submit.html" class="btn-nav btn-add">+ Pengumpulan Tugas</a>
    </nav>
  </header>

  <main>
    <div id="gameContainer" class="game-grid">
      <p style="grid-column: 1/-1; text-align: center;">Memuat daftar game...</p>
    </div>
  </main>

  <!-- Modal Iframe untuk Memainkan Game -->
  <div id="gameModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Judul Game</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx492EqcyC4F6kETP2nDkvU4OtzJF-KL8azgLzx3CYiWFC_dX6udJl0mUfVOXC6wmppSQ/exec";
    let gameData = [];

    document.addEventListener("DOMContentLoaded", loadGames);

    async function loadGames() {
      const container = document.getElementById("gameContainer");
      try {
        const response = await fetch(API_URL);
        gameData = await response.json();
        renderGames(gameData);
      } catch (error) {
        console.error(error);
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Gagal memuat data game. Silakan coba lagi nanti.</p>`;
      }
    }

    function renderGames(data) {
      const container = document.getElementById("gameContainer");
      container.innerHTML = "";

      if (!data || data.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">Belum ada game yang dikumpulkan.</p>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <div>
            <span class="badge">${item.Kategori || "Game"}</span>
            <h3>${item["Judul Game"] || "Tanpa Judul"}</h3>
            <p class="author">Oleh: <strong>${item["Nama Siswa"] || "-"}</strong> (${item.Kelas || "-"})</p>
            <p class="desc">${item.Deskripsi || "-"}</p>
          </div>
          <button class="btn-play" onclick="openGame('${item["Game URL"]}', '${item["Judul Game"]}')">▶ Mainkan Game</button>
        `;
        container.appendChild(card);
      });
    }

    function filterGames(kategori) {
      // Update tampilan tombol aktif
      document.querySelectorAll(".btn-filter").forEach(btn => {
        btn.classList.remove("active");
        if (btn.innerText.includes(kategori) || (kategori === "Semua" && btn.innerText.includes("Semua"))) {
          btn.classList.add("active");
        }
      });

      if (kategori === "Semua") {
        renderGames(gameData);
      } else {
        const filtered = gameData.filter(g => g.Kategori === kategori);
        renderGames(filtered);
      }
    }

    function openGame(url, title) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("gameFrame").src = url;
      document.getElementById("gameModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("gameModal").style.display = "none";
      document.getElementById("gameFrame").src = "";
    }
  </script>
</body>
</html>
